[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vqa-lab"
version = "0.1.0"
description = "Controlled benchmark of image encoders and question embeddings for VQA v2 (PyTorch)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scipy",    # scipy.stats.bootstrap for the image-bootstrap intervals
    "scikit-learn==1.9.1",
    "matplotlib",
    "torch==2.13.0",
    "torchvision",
    "timm",
    "transformers",
    "sentence-transformers==6.2.0",
    "gensim",
    "huggingface_hub",
    "einops",   # the only hard requirement of the NVIDIA C-RADIO model code (modern benchmark)
    "vllm==0.32.0",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "mutmut>=3.8", "vulture>=2.16"]   # vulture and mutmut: code-quality audits only
notebooks = ["ipykernel", "papermill", "nbstripout"]

[tool.hatch.build.targets.wheel]
packages = ["src/vqa_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mutmut]   # test audit only (dev extra): `mutmut run`, then `mutmut results`; works in the git-ignored mutants/ folder
source_paths = ["src/vqa_lab/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
mutate_only_covered_lines = true   # a line no test runs cannot be pinned by a test; coverage already reports it
