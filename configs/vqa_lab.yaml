# Configuration of vqa_lab: data locations and the encoder registries of the benchmarks. One encoder per line; `name`
# (the timm / torchvision / Hugging Face name) defaults to `key`, which is also the feature-cache folder name.

# Paths are relative to the repository root (or absolute). Override the root with VQA_LAB_ROOT.
paths:
  zip_dir: data/zip_file          # original downloads, read-only
  raw_dir: data/raw_files         # extracted zips
  processed_dir: data/processed   # derived tables and feature caches
  artifacts_dir: artifacts        # runs, predictions, registry, results

