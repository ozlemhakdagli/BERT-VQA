modern:   # notebook 04 (3,129-answer list)
  # name: "hf:<repository>" (transformers, weights in data/raw_files/models/<repository>) or a timm name.
  # tier 1 = the grid (every question encoder, both heads); tier 2 = bridge cells only (notebook 04 BRIDGE).
  image:
    - {key: siglip2_so400m, name: 'hf:google/siglip2-so400m-patch14-384', family: SigLIP 2, tier: 1}
    - {key: pe_lang_l, name: vit_pe_lang_large_patch14_448.fb, family: Perception Encoder, tier: 1}
    - {key: cradio_v4_so400m, name: 'hf:nvidia/C-RADIOv4-SO400M', family: C-RADIO, tier: 1}
    - {key: clip_l14_336, name: 'hf:openai/clip-vit-large-patch14-336', family: CLIP ViT, tier: 1}
    - {key: qwen3vl_emb_2b, name: 'hf:Qwen/Qwen3-VL-Embedding-2B', family: Qwen3-VL-Embedding, tier: 1}
    - {key: convnext_base.clip_laion2b, family: 'CLIP ConvNeXt (classical winner, bridge)', tier: 2}
  # Sentence vector = the model's own pooled, L2-normalised embedding
  # (text.SENTENCE_ARMS); token states = the model's last-layer states through the BiLSTM; bert = the classical token arm.
  text:
    - {key: qwen3_emb_0.6b, name: Qwen/Qwen3-Embedding-0.6B, kind: sentence vector, tier: 1}
    - {key: qwen3_emb_4b, name: Qwen/Qwen3-Embedding-4B, kind: sentence vector, tier: 1}
    - {key: qwen3vl_emb_2b_text, name: Qwen/Qwen3-VL-Embedding-2B (text side), kind: sentence vector, tier: 1}
    - {key: bert, name: bert-base-uncased, kind: contextual tokens (classical bridge), tier: 1}
    - {key: qwen3_emb_0.6b_tokens, name: Qwen/Qwen3-Embedding-0.6B (token states), kind: 'token states, standardised (BiLSTM)', tier: 2}
    - {key: qwen3_emb_4b_tokens, name: Qwen/Qwen3-Embedding-4B (token states), kind: 'token states, standardised (BiLSTM)', tier: 2}
